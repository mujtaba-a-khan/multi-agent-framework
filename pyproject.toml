[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madlab"
version = "0.1.0"
description = "Multi-Agent Defense Lab"
readme = "README.md"
authors = [{ name = "MADLab Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "rich>=13.7",
  "tqdm>=4.66",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pandas>=2.1",
  "fastapi>=0.111",
  "uvicorn>=0.23",
  "pydantic>=2.6",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
