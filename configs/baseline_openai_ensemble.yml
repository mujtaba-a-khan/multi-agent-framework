# configs/baseline_openai_ensemble.yml
run_name: "baseline_openai_ensemble_v0"
seed: 13

io:
  out_dir: "logs/runs"

target:
  name: "openai:gpt-4o-mini"

red:
  strategy: "basic_jailbreak_v0"
  params:
    variants: 3

blue:
  roles: ["judge_v0", "llm_guard_v1"]
  params:
    llm_guard_v1:
      model: "gpt-4o-mini"
      temperature: 0.0
      max_tokens: 8
      timeout: 30
      fallback_allow_on_error: true

eval:
  suites:
    - name: "harmless"
      path: "data/prompts/harmless.jsonl"
    - name: "harmful_jailbreak"
      path: "data/prompts/harmful_jailbreak.jsonl"
    - name: "privacy_leak"
      path: "data/prompts/privacy_leak.jsonl"
