[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madlab"
version = "0.1.0"
description = "Multi-Agent Defense Lab"
readme = "README.md"
authors = [{ name = "MADLab Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
